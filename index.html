<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>欢迎来到拯救者宇宙</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Exo+2:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --neon-cyan: #00f0ff;
            --neon-cyan-light: #99e6ff;
            --neon-purple: #d000ff;
            --card-bg: #0a0a18;
            --neon-glow: rgba(0, 240, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Orbitron', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            background-image: radial-gradient(circle at 50% 50%, rgba(10, 30, 50, 0.3), transparent 70%);
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.7;
        }

        /* ========== 水印基础样式 ========== */
        .product-watermark {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            white-space: nowrap;
            color: #fff; 
            text-shadow: 
                0 0 5px var(--neon-cyan), 
                0 0 10px var(--neon-cyan);
            position: absolute;
            z-index: 5;
            pointer-events: none;
            padding: 0;
            border: none;
            background: none;
            box-shadow: none;
            border-radius: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- 倒计时阶段：在页面上方 --- */
        .watermark-position-top {
            top: 150px; 
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1.2rem, 5vw, 1.6rem);
        }

        /* --- 正式页面阶段：精准匹配截图位置 --- */
        .watermark-position-bottom {
            top: auto;
            /* 【核心修改】距离卡片底部55px，完美匹配你截图的位置 */
            bottom: 55px; 
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            text-align: center;
            width: 100%;
        }

        /* --- 倒计时容器 --- */
        #countdown-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
            position: relative;
            margin-top: 0;
        }

        .glitch-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 15px;
            color: var(--neon-cyan);
            text-shadow: 
                0 0 6px var(--neon-cyan),
                0 0 12px var(--neon-cyan),
                0 0 25px var(--neon-cyan);
            position: relative;
        }

        .system-booting {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 25px 0 40px 0;
            color: var(--neon-cyan);
            text-shadow: 
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan);
            position: relative;
            animation: pulse 3s infinite alternate;
        }

        .timer-box {
            background: rgba(0, 10, 20, 0.45);
            border: 4px solid var(--neon-cyan);
            border-image: linear-gradient(to right, var(--neon-purple), var(--neon-cyan)) 1;
            padding: 22px 32px;
            border-radius: 12px;
            box-shadow: 
                0 0 25px rgba(0, 240, 255, 0.35),
                inset 0 0 35px rgba(0, 240, 255, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            z-index: 10;
            min-width: 90%;
            max-width: 620px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }

        .number {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2.2rem, 8vw, 3.5rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 12px var(--neon-cyan),
                0 0 25px var(--neon-cyan);
            position: relative;
        }

        .label {
            font-size: 0.9rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 6px;
            opacity: 0.85;
        }

        /* --- 正式内容容器 --- */
        #main-content {
            display: none;
            width: 100%;
            max-width: 700px;
            padding: 10px;
            text-align: center;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* 【同步修改】底部内边距增加到120px，完美适配水印位置 */
        .hero-header {
            background: #0a0a18;
            border: 4px solid var(--neon-cyan);
            padding: 30px 15px 120px 15px;
            min-height: 450px;
            max-width: 90%;
            border-radius: 16px;
            box-shadow: 
                0 0 65px var(--neon-glow),
                inset 0 0 45px rgba(0, 240, 255, 0.12);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-header::after {
           content: "UNLOCKED";
            position: absolute;
            top: 10px;          
            right: 15px;        
            background: var(--neon-purple);
            color: #fff;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 900;
            border-radius: 6px;
            text-shadow: 0 0 8px #fff;
            animation: blink 1.2s infinite alternate;
            z-index: 1;         
            border: 1px solid #fff;
            white-space: nowrap;
        }

        h1 {
           font-family: 'Exo 2', 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.25); 
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            white-space: nowrap;
        }

        p {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 500;
            color: #a0e0ff;
            line-height: 1.7;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            margin-bottom: 20px;
        }

        .cta-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-weight: 700;
            background: transparent;
            color: var(--neon-cyan);
            border: 4px solid var(--neon-cyan);
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s ease;
            text-decoration: none;
            box-shadow: 0 0 20px var(--neon-glow);
            font-family: 'Exo 2', sans-serif;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            line-height: 1.2;
        }

        .cta-button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--neon-cyan);
            transform: scale(1.05);
        }

        /* --- 动画 --- */
        @keyframes pulse {
            0% { opacity: 0.9; text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan); }
            100% { opacity: 1; text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan), 0 0 50px var(--neon-cyan); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes blink {
            0% { opacity: 0.9; }
            100% { opacity: 0.3; }
        }

       @media (max-width: 768px) {
            .glitch-title { 
                font-size: 1.6rem; 
                margin-bottom: 10px;
            }
            .system-booting {
                font-size: 1.8rem;
                margin: 20px 0 30px 0;
            }
            
            /* 移动端：倒计时阶段水印位置 */
            .watermark-position-top {
                top: 85px; 
                font-size: 0.85rem;
                letter-spacing: 2px;
            }
            /* 【移动端同步调整】距离卡片底部45px，保持和PC端一样的相对比例 */
            .watermark-position-bottom {
                bottom: 45px;
                font-size: 0.75rem;
                letter-spacing: 1px;
            }

            .number { font-size: 2.2rem;  }
            .hero-header h1 { 
                letter-spacing: 1px;
                font-size: clamp(1.8rem, 6vw, 3rem);
                text-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            }
            .timer-box {   
                gap: 15px; 
                padding: 20px 15px; 
                border-width: 3px; 
                min-width: 95%; 
            }
            /* 移动端底部内边距同步调整 */
            .hero-header { 
                border-width: 3px; 
                padding: 30px 15px 100px 15px;
                min-height: 380px; 
                max-width: 95%;
            }
            .cta-button { padding: 12px 30px; border-width: 3px; font-size: 0.9rem; letter-spacing: 1px;}
            .hero-header::after {
                top: 10px;
                right: 10px;
                padding: 3px 10px;
                font-size: 0.6rem;
                border-width: 1px;
            }
        }

        /* 微信浏览器专属适配 */
        @supports (-webkit-overflow-scrolling: touch) {
            body {
                min-height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>

    <!-- 倒计时阶段水印（全局定位） -->
    <div id="countdown-watermark" class="product-watermark watermark-position-top">拯救者手机Y70 新一代</div>

    <!-- 倒计时页面 -->
    <div id="countdown-container">
        <div class="glitch-title">你的碎片 即将解锁</div>
        <div class="system-booting">SYSTEM BOOTING</div>
        <div class="timer-box">
            <div class="time-unit">
                <span class="number" id="days">00</span>
                <span class="label">天</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">00</span>
                <span class="label">时</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">00</span>
                <span class="label">分</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">00</span>
                <span class="label">秒</span>
            </div>
        </div>
    </div>

    <!-- 正式内容页面 -->
    <div id="main-content">
        <div class="hero-header">
            <!-- 正式页面的水印（卡片内部定位） -->
            <div id="card-watermark" class="product-watermark watermark-position-bottom" style="display: none;">拯救者手机Y70 新一代</div>
            
            <h1>欢迎来到拯救者宇宙</h1>
            <p>您的碎片已超前解锁 数据正在同步</p>
            <a href="#" class="cta-button">请在社群领取您的解锁密钥</a>
        </div>
    </div>

    <script>
        // 目标时间：2026年5月18日
        const targetDate = new Date('2026-05-05T14:40:00+08:00').getTime();

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownContainer = document.getElementById('countdown-container');
        const mainContent = document.getElementById('main-content');
        
        // 获取两个水印元素
        const countdownWatermark = document.getElementById('countdown-watermark');
        const cardWatermark = document.getElementById('card-watermark');

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                countdownContainer.style.display = 'none';
                mainContent.style.display = 'block';
                
                // 隐藏倒计时阶段的全局水印
                countdownWatermark.style.display = 'none';
                // 显示卡片内部的水印
                cardWatermark.style.display = 'block';

                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // 微信页面加载完成后强制重绘
        if (typeof WeixinJSBridge !== 'undefined') {
            WeixinJSBridge.invoke('getNetworkType', {}, function(e) {
                window.dispatchEvent(new Event('resize'));
            });
        }
    </script>
</body>
</html>
