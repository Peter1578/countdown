<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到拯救者宇宙</title>
    <!-- 引入科技感+电竞字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Exo+2:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --neon-cyan: #00f0ff;
            --neon-purple: #d000ff;
            --card-bg: #0a0a18;
            --neon-glow: rgba(0, 240, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Orbitron', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 扫描线效果 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
        }

        /* --- 倒计时容器 --- */
        #countdown-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }

        .glitch-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 50px;
            color: var(--neon-cyan);
            text-shadow: 
                0 0 5px var(--neon-cyan),
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan);
            position: relative;
        }

        .timer-box {
            background: rgba(0, 10, 20, 0.4);
            border: 4px solid #00f0ff; /* 电脑端边框加粗 */
            border-image: linear-gradient(to right, #d000ff, #00dbdb) 1;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 
                0 0 20px rgba(0, 240, 255, 0.3),
                inset 0 0 30px rgba(0, 240, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px; /* 时间之间的间距 */
            flex-wrap: wrap; /* 取消强制nowrap，适配手机换行（必要时） */
            z-index: 10;
            min-width: 90%;
            max-width: 600px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px; /* 手机端最小宽度适配 */
        }

        .number {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan);
            position: relative;
        }

        .label {
            font-size: 0.9rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 5px;
        }

        /* --- 正式内容容器 --- */
        #main-content {
            display: none;
            width: 100%;
            max-width: 700px;
            padding: 10px;
            text-align: center;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hero-header {
            background: #0a0a18;
            border: 4px solid var(--neon-cyan); /* 核心：正式页面边框加粗到4px */
            padding: 30px 15px;
            min-height: 450px;
            max-width: 90%;
            border-radius: 16px;
            box-shadow: 
                0 0 60px var(--neon-glow), /* 增强发光效果 */
                inset 0 0 40px rgba(0, 240, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-header::after {
           content: "UNLOCKED";
            position: absolute;
            top: 10px;          
            right: 15px;        
            background: var(--neon-purple);
            color: #fff;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 900; /* 标签字体加粗 */
            border-radius: 6px;
            text-shadow: 0 0 8px #fff; /* 增强发光 */
            animation: blink 1.2s infinite alternate;
            z-index: 1;         
            border: 1px solid #fff; /* 标签加细边框，更电竞 */
            white-space: nowrap; /* 强制标题不换行 */
        }

        h1 {
           font-family: 'Exo 2', 'Orbitron', sans-serif; /* 更电竞的字体 */
            font-size: clamp(1.8rem, 6vw, 3.5rem); /* 标题放大 */
            font-weight: 900; /* 极致加粗 */
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            /* 核心修改：降低阴影透明度+缩小阴影范围，保证文字清晰 */
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.25); 
            letter-spacing: 1px; /* 增加字间距，更电竞 */
            position: relative;
            z-index: 2; /* 提升标题层级 */
            white-space: nowrap; /* 强制标题不换行 */
        }

        p {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 500;
            color: #a0e0ff;
            line-height: 1.7;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
            white-space: nowrap; /* 正文不换行 */
            margin-bottom: 20px;
        }

        .cta-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px; /* 按钮放大 */
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-weight: 700;
            background: transparent;
            color: var(--neon-cyan);
            border: 4px solid var(--neon-cyan); /* 按钮边框加粗 */
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px; /* 增加字间距 */
            transition: 0.3s;
            text-decoration: none;
            box-shadow: 0 0 20px var(--neon-glow);
            font-family: 'Exo 2', sans-serif; /* 按钮用电竞字体 */
            position: relative;
            z-index: 2;
            white-space: nowrap; /* 按钮文字不换行 */
            line-height: 1.2;
        }

        .cta-button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--neon-cyan);
            transform: scale(1.05); /* hover轻微放大，更动感 */
        }

        /* --- 动画 --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes blink {
            0% { opacity: 0.9; }
            100% { opacity: 0.3; }
        }

       @media (max-width: 768px) {
            .glitch-title { 
                font-size: 1.6rem; 
                margin-bottom: 30px; /* 减少标题间距，适配小屏 */
            }
            .number { font-size: 2.2rem;  }
            .hero-header h1 { 
                letter-spacing: 1px;
                font-size: clamp(1.8rem, 6vw, 3rem);
                text-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            }
            .timer-box {   
                gap: 15px; 
                padding: 20px 15px; 
                border-width: 3px; 
                min-width: 95%; 
            }
            .hero-header { border-width: 3px; padding: 30px 15px;   min-height: 380px; max-width: 95%;}
            .cta-button { padding: 12px 30px; border-width: 3px; font-size: 0.5rem; letter-spacing: 1px;}
            /* 移动端适配标签位置 */
            .hero-header::after {
                top: 10px;
                right: 10px;
                padding: 3px 10px;
                font-size: 0.6rem;
                border-width: 1px;
            }
        }
    </style>
</head>
<body>

    <!-- 倒计时页面 -->
    <div id="countdown-container">
        <div class="glitch-title">你的碎片 即将解锁</div>
        <div class="glitch-title">SYSTEM BOOTING</div>
        <div class="timer-box">
            <div class="time-unit">
                <span class="number" id="days">00</span>
                <span class="label">天</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">00</span>
                <span class="label">时</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">00</span>
                <span class="label">分</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">00</span>
                <span class="label">秒</span>
            </div>
        </div>
    </div>

    <!-- 正式内容页面 -->
    <div id="main-content">
        <div class="hero-header">
            <h1>欢迎来到拯救者宇宙</h1>
            <p>您的碎片已超前解锁 数据正在同步</p>
            <a href="#" class="cta-button">请在社群领取您的解锁密钥</a>
        </div>
    </div>

    <script>
        // 设置目标时间：2026年5月18日 00:00 (北京时间)
        const targetDate = new Date('2026-05-18T00:00:00+08:00').getTime();

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownContainer = document.getElementById('countdown-container');
        const mainContent = document.getElementById('main-content');

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                // 倒计时结束，切换内容
                countdownContainer.style.display = 'none';
                mainContent.style.display = 'block';
                return; // 停止函数
            }

            // 计算时间
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // 更新DOM，补零
            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        // 立即执行一次
        updateCountdown();
        // 每秒更新
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
